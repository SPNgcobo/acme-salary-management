# --- Application ---
spring.application.name=salary-management
server.port=8080

# --- Datasource (values come from environment / .env) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/acme_salary_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates entity mappings against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- Actuator (health endpoint for deploy checks) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- Logging ---
logging.level.org.hibernate.SQL=INFO
logging.level.org.flywaydb=INFO

# --- Test profile overrides ---
# See src/test/resources/application-test.properties

spring.profiles.active=dev
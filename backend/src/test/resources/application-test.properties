# Tests run against the real Postgres database (set via env vars).
# Flyway migrations run automatically before tests execute.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/acme_salary_management}
spring.datasource.username=${DB_USERNAME:acme_app}
spring.datasource.password=${DB_PASSWORD:acme_app}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true